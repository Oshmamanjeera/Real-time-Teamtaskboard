<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <!-- Cloud body gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F2F7FD" />
      <stop offset="100%" stop-color="#DCEBFA" />
    </linearGradient>
    <!-- Wing gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BFD7F3" />
    </linearGradient>
    <!-- Bow gradient -->
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8EF" />
      <stop offset="100%" stop-color="#F7CADA" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8FA8E8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Angel Wing -->
  <g transform="matrix(0.95 -0.3 0.3 0.95 8 46)">
    <path d="M 28 32 C 12 28 4 14 10 4 C 18 -6 32 6 36 20 Z" fill="url(#wingGrad)" stroke="#BFD7F3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 24 C 14 20 10 12 14 6" fill="none" stroke="#BFD7F3" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Right Angel Wing -->
  <g transform="matrix(-0.95 -0.3 -0.3 0.95 152 46)">
    <path d="M 28 32 C 12 28 4 14 10 4 C 18 -6 32 6 36 20 Z" fill="url(#wingGrad)" stroke="#BFD7F3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 24 C 14 20 10 12 14 6" fill="none" stroke="#BFD7F3" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Main Round Puffy Cloud Body -->
  <g filter="url(#softShadow)">
    <path d="
      M 48 95
      C 32 95 24 82 26 68
      C 28 54 40 48 50 50
      C 52 38 66 26 82 26
      C 98 26 112 36 116 48
      C 126 46 138 52 140 66
      C 142 80 134 95 118 95
      C 112 108 92 112 80 112
      C 66 112 52 106 48 95 Z"
      fill="url(#cloudGrad)"
      stroke="#BFD7F3"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </g>

  <!-- Cute Blush Ribbon Bow on Top-Left -->
  <g transform="translate(46, 26)">
    <!-- Left loop -->
    <path d="M 0 6 C -14 -6 -18 12 -4 10 Z" fill="url(#bowGrad)" stroke="#E8A7BD" stroke-width="2" />
    <!-- Right loop -->
    <path d="M 0 6 C 14 -6 18 12 4 10 Z" fill="url(#bowGrad)" stroke="#E8A7BD" stroke-width="2" />
    <!-- Bow tails -->
    <path d="M -2 10 Q -6 18 -10 20 Q -4 16 0 12" fill="#F7CADA" stroke="#E8A7BD" stroke-width="1.5" />
    <path d="M 2 10 Q 6 18 10 20 Q 4 16 0 12" fill="#F7CADA" stroke="#E8A7BD" stroke-width="1.5" />
    <!-- Center knot -->
    <circle cx="0" cy="7" r="4.5" fill="#F2AEC5" stroke="#E8A7BD" stroke-width="2" />
  </g>

  <!-- Blush Cheeks -->
  <ellipse cx="50" cy="74" rx="8" ry="5" fill="#F7CADA" opacity="0.85" />
  <ellipse cx="110" cy="74" rx="8" ry="5" fill="#F7CADA" opacity="0.85" />

  <!-- Sparkling Anime Eyes -->
  <!-- Left Eye -->
  <g transform="translate(62, 64)">
    <ellipse cx="0" cy="0" rx="5.5" ry="7.5" fill="#7A5A50" />
    <circle cx="-2" cy="-2.5" r="2.2" fill="#FFFFFF" />
    <circle cx="2" cy="2.5" r="1.2" fill="#FFFFFF" />
  </g>
  <!-- Right Eye -->
  <g transform="translate(98, 64)">
    <ellipse cx="0" cy="0" rx="5.5" ry="7.5" fill="#7A5A50" />
    <circle cx="-2" cy="-2.5" r="2.2" fill="#FFFFFF" />
    <circle cx="2" cy="2.5" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Smiling Little Mouth -->
  <path d="M 76 74 Q 80 80 84 74" fill="none" stroke="#7A5A50" stroke-width="2.5" stroke-linecap="round" />

  <!-- Twinkling Star Accent -->
  <g transform="translate(132, 28) scale(0.8)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#FFD966" stroke="#F5C430" stroke-width="1.2" />
  </g>
</svg>

